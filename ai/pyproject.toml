[project]
name = "shrimp-ai"
version = "0.1.0"
description = "흰다리새우 섭식 활동 분석 (클릭 검출 · 이상 탐지)"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
